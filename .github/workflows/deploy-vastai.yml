name: Deploy CDF STT (Vast.ai)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          # No build-args: HF_TOKEN must never be baked into this public image.
          # It is supplied at runtime from a secret (see VASTAI_STARTUP.md).

      - name: Deployment Instructions
        run: |
          echo "=================================================="
          echo "Docker Image Built Successfully!"
          echo "=================================================="
          echo ""
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo ""
          echo "HF_TOKEN is NOT in the image. Set it as a runtime env var on the instance."
          echo ""
          echo "To deploy on Vast.ai:"
          echo "1. Create instance with image: ghcr.io/calldatasystems/cdf-stt:latest"
          echo "2. SSH into instance"
          echo "3. Run startup script:"
          echo "   cd /app"
          echo "   ./start_stt_service.sh"
          echo ""
          echo "The script will automatically:"
          echo "  - Start Redis server"
          echo "  - Start API on port 8000"
          echo "  - Start background worker"
          echo "  - Show external API URL"
          echo ""
          echo "=================================================="
